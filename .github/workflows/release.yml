name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check.py
      - name: Package specification and conformance fixtures
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          mkdir release
          tar -czf "release/saddle-specification-${RELEASE_TAG}.tar.gz" LICENSE README.md VERSION specification schemas conformance
          (cd release && sha256sum *.tar.gz > SHA256SUMS.txt)
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes "${flags[@]}"
